<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVIDIA NIM 对话</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1b1f27;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #76b900; /* NVIDIA 绿 */
    --accent-dim: #5c9100;
    --user-bubble: #234d7a;
    --ai-bubble: #1e222b;
    --sidebar-w: 260px;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* ===== 侧边栏 ===== */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .2s ease;
  }
  #sidebar.hidden { margin-left: calc(var(--sidebar-w) * -1); }
  .side-head {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .side-head h1 {
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #new-chat {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #0b0d10;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #new-chat:hover { background: var(--accent-dim); }
  #session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .session {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    color: var(--text);
    position: relative;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: #24301a; outline: 1px solid var(--accent-dim); }
  .session .title {
    flex: 1;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session .actions {
    display: none;
    gap: 2px;
  }
  .session:hover .actions { display: flex; }
  .session .actions button {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1;
  }
  .session .actions button:hover { background: #2c313c; color: var(--text); }
  .session .actions button.del:hover { color: var(--danger); }
  .empty-tip {
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    padding: 24px 12px;
  }
  .side-foot {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  /* ===== 主区域 ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #toggle-side {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #chat-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  select, button {
    background: #22262f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  select:focus, button:focus { outline: 2px solid var(--accent-dim); }
  button.primary {
    background: var(--accent);
    border: none;
    color: #0b0d10;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-dim); }
  button.primary:disabled { background: #3a3f49; color: var(--muted); cursor: not-allowed; }
  label { font-size: 13px; color: var(--muted); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .role {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }
  .msg.ai .content { min-height: 1.4em; }
  .cursor { display: inline-block; width: 8px; background: var(--accent); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #error {
    padding: 10px 20px;
    background: #4a1d1d;
    color: #ffb3b3;
    font-size: 13px;
    display: none;
    border-top: 1px solid var(--border);
  }

  #input-area {
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: #22262f;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    resize: none;
    font-family: inherit;
    max-height: 140px;
  }
  #input:focus { outline: 2px solid var(--accent-dim); }
  #send { align-self: flex-end; }
  #statusbar { padding: 0 20px 8px; font-size: 12px; color: var(--muted); }

  /* 重命名输入框 */
  .rename-input {
    flex: 1;
    background: #22262f;
    border: 1px solid var(--accent-dim);
    color: var(--text);
    border-radius: 5px;
    font-size: 13px;
    padding: 4px 6px;
  }
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside id="sidebar">
  <div class="side-head">
    <h1>⚡ NVIDIA NIM</h1>
    <button id="new-chat">＋ 新建会话</button>
  </div>
  <div id="session-list"></div>
  <div class="side-foot">会话保存在本机浏览器</div>
</aside>

<!-- 主区域 -->
<div id="main">
  <header>
    <button id="toggle-side" title="收起/展开侧边栏">☰</button>
    <div id="chat-title">新会话</div>
    <div class="controls">
      <label for="model">模型:</label>
      <select id="model"></select>
      <button id="clear" title="清空当前会话">清空</button>
    </div>
  </header>

  <div id="chat"></div>
  <div id="error"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send" class="primary">发送</button>
  </div>
  <div id="statusbar"></div>
</div>

<script>
// ===== 配置 =====
// 纯静态部署（GitHub Pages），浏览器直连 NVIDIA NIM 的 OpenAI 兼容接口。
// 注意：apiKey 会公开在页面源码中，请使用额度可控的 Key，泄露后到 build.nvidia.com 吊销换新。
const CONFIG = {
  apiUrl: "https://integrate.api.nvidia.com/v1/chat/completions",
  apiKey: "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",
  timeoutSeconds: 300,
  systemPrompt: "你是一个乐于助人的 AI 助手，请用中文简洁准确地回答。",
  models: [
    { id: "z-ai/glm-5.2",                       name: "nvidia-glm-5.2" },
    { id: "minimaxai/minimax-m3",               name: "nvidia-minimax-m3" },
    { id: "nvidia/nemotron-3-ultra-550b-a55b",  name: "nvidia-nemotron-3-ultra" },
    { id: "nvidia/nemotron-3-super-120b-a12b",  name: "nvidia-nemotron-3-super" }
  ],
  defaultModel: "z-ai/glm-5.2"
};
const STORAGE_KEY = "nim-chat-sessions-v1";

// ===== 元素 =====
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const modelSel = document.getElementById("model");
const statusEl = document.getElementById("statusbar");
const errorEl = document.getElementById("error");
const sidebarEl = document.getElementById("sidebar");
const sessionListEl = document.getElementById("session-list");
const newChatBtn = document.getElementById("new-chat");
const toggleSideBtn = document.getElementById("toggle-side");
const chatTitleEl = document.getElementById("chat-title");

// 填模型下拉框
CONFIG.models.forEach(m => {
  const opt = document.createElement("option");
  opt.value = m.id;
  opt.textContent = m.name;
  modelSel.appendChild(opt);
});

// ===== 会话数据（持久化到 localStorage）=====
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.sessions)) return data;
    }
  } catch (e) {}
  return null;
}
function saveSessions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    sessions: state.sessions,
    currentId: state.currentId
  }));
}

function newSession() {
  return {
    id: "s" + Math.random().toString(36).slice(2, 10),
    title: "新会话",
    model: CONFIG.defaultModel,
    messages: [{ role: "system", content: CONFIG.systemPrompt }],
    updatedAt: Date.now()
  };
}

let state = loadSessions();
if (!state || !state.sessions.length) {
  const s = newSession();
  state = { sessions: [s], currentId: s.id };
  saveSessions();
}
if (!state.sessions.find(s => s.id === state.currentId)) {
  state.currentId = state.sessions[0].id;
}

let sending = false;
let abortController = null;

function currentSession() {
  return state.sessions.find(s => s.id === state.currentId);
}

// ===== 渲染侧边栏 =====
function renderSidebar() {
  sessionListEl.innerHTML = "";
  const sorted = [...state.sessions].sort((a, b) => b.updatedAt - a.updatedAt);
  if (!sorted.length) {
    const tip = document.createElement("div");
    tip.className = "empty-tip";
    tip.textContent = "还没有会话，点击上方“新建会话”开始";
    sessionListEl.appendChild(tip);
    return;
  }
  sorted.forEach(s => {
    const item = document.createElement("div");
    item.className = "session" + (s.id === state.currentId ? " active" : "");
    item.dataset.id = s.id;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = s.title || "新会话";
    item.appendChild(title);

    const actions = document.createElement("div");
    actions.className = "actions";
    const renameBtn = document.createElement("button");
    renameBtn.textContent = "✏️";
    renameBtn.title = "重命名";
    const delBtn = document.createElement("button");
    delBtn.textContent = "🗑️";
    delBtn.title = "删除";
    delBtn.className = "del";
    actions.appendChild(renameBtn);
    actions.appendChild(delBtn);
    item.appendChild(actions);

    item.addEventListener("click", () => switchSession(s.id));
    delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
    renameBtn.addEventListener("click", (e) => { e.stopPropagation(); startRename(item, s); });

    sessionListEl.appendChild(item);
  });
}

function startRename(item, s) {
  const titleEl = item.querySelector(".title");
  const input = document.createElement("input");
  input.className = "rename-input";
  input.value = s.title;
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  const commit = () => {
    s.title = input.value.trim() || s.title;
    saveSessions();
    renderSidebar();
    renderHeader();
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.value = s.title; input.blur(); }
  });
}

function deleteSession(id) {
  const idx = state.sessions.findIndex(s => s.id === id);
  if (idx === -1) return;
  const s = state.sessions[idx];
  if (!confirm(`删除会话「${s.title}」？此操作不可恢复。`)) return;
  if (sending && id === state.currentId && abortController) abortController.abort();
  state.sessions.splice(idx, 1);
  if (!state.sessions.length) state.sessions.push(newSession());
  if (state.currentId === id) state.currentId = state.sessions[0].id;
  saveSessions();
  renderAll();
}

function switchSession(id) {
  if (sending && abortController) abortController.abort();
  state.currentId = id;
  saveSessions();
  renderAll();
  inputEl.focus();
}

function createSession() {
  if (sending && abortController) abortController.abort();
  const s = newSession();
  state.sessions.push(s);
  state.currentId = s.id;
  saveSessions();
  renderAll();
  inputEl.focus();
}

// ===== 渲染主区域 =====
function renderHeader() {
  const s = currentSession();
  chatTitleEl.textContent = s.title || "新会话";
  modelSel.value = s.model || CONFIG.defaultModel;
}

function renderChat() {
  chatEl.innerHTML = "";
  const s = currentSession();
  s.messages.forEach(m => {
    if (m.role === "system") return;
    addBubble(m.role, m.content, m.role === "assistant" ? m.model : null);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderAll() {
  renderSidebar();
  renderHeader();
  renderChat();
  clearError();
  statusEl.textContent = "";
}

function addBubble(role, text, modelName) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai");
  const roleLabel = document.createElement("span");
  roleLabel.className = "role";
  roleLabel.textContent = role === "user"
    ? "我"
    : (modelName || CONFIG.models.find(m => m.id === modelSel.value)?.name || "AI");
  const content = document.createElement("div");
  content.className = "content";
  if (typeof text === "string") content.textContent = text;
  div.appendChild(roleLabel);
  div.appendChild(content);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return content;
}

function showError(msg) {
  errorEl.textContent = "⚠ " + msg;
  errorEl.style.display = "block";
}
function clearError() { errorEl.style.display = "none"; }

// ===== 调用 NVIDIA NIM (OpenAI 兼容接口，流式) =====
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  clearError();

  const s = currentSession();
  const modelId = modelSel.value;
  s.model = modelId;

  s.messages.push({ role: "user", content: text });
  // 用第一条用户消息做会话标题
  if (s.title === "新会话") {
    s.title = text.slice(0, 24) + (text.length > 24 ? "…" : "");
  }
  s.updatedAt = Date.now();
  addBubble("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  renderSidebar();
  renderHeader();
  saveSessions();

  const modelName = CONFIG.models.find(m => m.id === modelId)?.name || "AI";
  const aiContent = addBubble("ai", "", modelName);
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.innerHTML = "&nbsp;";
  aiContent.appendChild(cursor);

  sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "生成中…";
  statusEl.textContent = "正在连接模型…";

  abortController = new AbortController();
  const timeout = setTimeout(() => abortController.abort(), CONFIG.timeoutSeconds * 1000);

  let full = "";
  try {
    const resp = await fetch(CONFIG.apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + CONFIG.apiKey
      },
      body: JSON.stringify({
        model: modelId,
        messages: s.messages,
        temperature: 0.6,
        max_tokens: 4096,
        stream: true
      }),
      signal: abortController.signal
    });

    if (!resp.ok) {
      const errText = await resp.text();
      if (resp.status === 401) throw new Error("HTTP 401：API Key 无效或已过期，请检查页面内 CONFIG.apiKey");
      throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 300)}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === "[DONE]") break;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            full += delta;
            aiContent.textContent = full;
            aiContent.appendChild(cursor);
            chatEl.scrollTop = chatEl.scrollHeight;
            statusEl.textContent = "";
          }
        } catch (e) { /* 跳过不完整行 */ }
      }
    }

    s.messages.push({ role: "assistant", content: full, model: modelName });
    s.updatedAt = Date.now();
    statusEl.textContent = "";
  } catch (err) {
    if (err.name === "AbortError") {
      aiContent.textContent = full + "\n\n[已取消/超时]";
      if (full) { s.messages.push({ role: "assistant", content: full, model: modelName }); }
    } else {
      const msg = (err.message === "Failed to fetch")
        ? "网络请求失败：请检查网络连接（浏览器直连 integrate.api.nvidia.com）"
        : (err.message || String(err));
      showError(msg);
      aiContent.textContent = full || "（请求失败）";
      if (full) { s.messages.push({ role: "assistant", content: full, model: modelName }); }
    }
    statusEl.textContent = "";
  } finally {
    clearTimeout(timeout);
    cursor.remove();
    saveSessions();
    renderSidebar();
    sending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "发送";
    chatEl.scrollTop = chatEl.scrollHeight;
    inputEl.focus();
  }
}

// ===== 事件 =====
sendBtn.addEventListener("click", sendMessage);
newChatBtn.addEventListener("click", createSession);
toggleSideBtn.addEventListener("click", () => sidebarEl.classList.toggle("hidden"));

modelSel.addEventListener("change", () => {
  const s = currentSession();
  s.model = modelSel.value;
  saveSessions();
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// 自适应输入框高度
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

clearBtn.addEventListener("click", () => {
  if (sending && abortController) abortController.abort();
  const s = currentSession();
  s.messages = s.messages.slice(0, 1);
  s.updatedAt = Date.now();
  saveSessions();
  renderChat();
  renderSidebar();
  clearError();
  statusEl.textContent = "";
});

// 初始化
renderAll();
inputEl.focus();
</script>
</body>
</html>
